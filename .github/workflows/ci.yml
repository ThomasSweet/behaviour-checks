name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build and pack
        run: |
          mkdir packed
          npm pack --pack-destination packed

      - name: Keep the package for the install checks
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: packed/*.tgz
          retention-days: 7

  test:
    name: test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Fixture tests
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.browser }}
          path: |
            reports/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  install:
    name: install (Node ${{ matrix.node }}, Playwright ${{ matrix.playwright }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20.19.0
            playwright: 1.64.0
          - node: 22.12.0
            playwright: 1.64.0
          - node: 24
            playwright: 1.64.0
          - node: 26
            playwright: latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: packed

      - name: Install the package in a new project and use it
        env:
          PLAYWRIGHT_VERSION: ${{ matrix.playwright }}
        run: node scripts/check-package.mjs packed/*.tgz
