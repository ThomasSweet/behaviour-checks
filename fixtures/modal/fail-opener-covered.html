<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modal walk: an opener a click cannot reach</title>
    <style>
      .cover {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>An opener a click cannot reach</h1>
      <button id="open" type="button">Open the dialog</button>
      <span id="open-unfocusable" role="button">Open the dialog, no focus</span>
      <div class="cover"></div>
    </main>
  </body>
</html>
