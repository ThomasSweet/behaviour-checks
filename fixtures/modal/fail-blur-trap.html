<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modal walk: a dialog whose script drops focus behind it</title>
  </head>
  <body>
    <main>
      <h1>A dialog whose script drops focus behind it</h1>
      <a href="#before" id="before">A link before</a>
      <button id="open" type="button">Open the dialog</button>
      <a href="#after" id="after">A link after</a>
    </main>
    <div id="blurry" role="dialog" aria-modal="true" aria-labelledby="blurry-title" hidden>
      <h2 id="blurry-title">A dialog that hides its leak</h2>
      <button id="blurry-ok" type="button">OK</button>
      <button id="blurry-close" type="button">Close</button>
    </div>
    <script>
      const dialog = document.getElementById('blurry')
      const opener = document.getElementById('open')
      const close = () => {
        dialog.hidden = true
        opener.focus()
      }
      document.addEventListener('focusin', (event) => {
        if (!dialog.hidden && !dialog.contains(event.target)) event.target.blur()
      })
      opener.addEventListener('click', () => {
        dialog.hidden = false
        document.getElementById('blurry-ok').focus()
      })
      document.getElementById('blurry-close').addEventListener('click', close)
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !dialog.hidden) close()
      })
    </script>
  </body>
</html>
