<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modal walk: a role=dialog inside a native modal dialog</title>
    <style>
      .carousel { overflow-x: auto; scroll-snap-type: x mandatory; scroll-marker-group: after; inline-size: 30rem; }
      .carousel-track { display: grid; grid-auto-flow: column; grid-auto-columns: 80%; gap: 1rem; margin: 0; padding: 0; list-style: none; }
      .carousel-slide { scroll-snap-align: center; min-block-size: 6rem; }
      .carousel::scroll-marker-group { display: flex; gap: .5rem; }
      .carousel-slide::scroll-marker { content: ' ' / attr(data-marker-label); inline-size: 1rem; block-size: 1rem; border: 1px solid; border-radius: 50%; }
    </style>
  </head>
  <body>
    <main>
      <h1>A role=dialog inside a native modal dialog</h1>
      <div class="carousel" role="region" aria-label="Example carousel">
        <ul class="carousel-track" role="list">
          <li class="carousel-slide" data-marker-label="Go to slide 1 of 3">Slide 1</li>
          <li class="carousel-slide" data-marker-label="Go to slide 2 of 3">Slide 2</li>
          <li class="carousel-slide" data-marker-label="Go to slide 3 of 3">Slide 3</li>
        </ul>
      </div>
      <button id="open" type="button" aria-controls="inner">Open the dialog</button>
      <dialog id="wrapper">
        <div id="inner" role="dialog" aria-modal="true" aria-labelledby="inner-title">
          <h2 id="inner-title">A dialog inside a native modal</h2>
          <button id="inner-ok" type="button">OK</button>
          <button id="inner-close" type="button">Close</button>
        </div>
      </dialog>
    </main>
    <script>
      const wrapper = document.getElementById('wrapper')
      document.getElementById('open').addEventListener('click', () => wrapper.showModal())
      document.getElementById('inner-close').addEventListener('click', () => wrapper.close())
    </script>
  </body>
</html>
